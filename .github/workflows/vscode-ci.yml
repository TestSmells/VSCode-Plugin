name: VS Code CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type-check, corpus, and VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'

      - name: Install dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run check

      - name: Compile extension
        run: npm run compile

      - name: Compare regression corpus
        run: npm run test:corpus

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-smell-detector-vsix
          path: test-smell-detector.vsix
          if-no-files-found: error
          retention-days: 14
